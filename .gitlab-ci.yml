# The shell runners provide virtualenv and Python 3.12 for bootstrapping.

# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_PYTHON_INSTALL_DIR: "$CI_PROJECT_DIR/.cache/python"

# Pip's cache doesn't store the python packages
# https://pip.pypa.io/en/stable/reference/pip_install/#caching
# If you want to also cache the installed packages, you have to install
# them in a virtualenv and cache it as well.
#cache:
  #paths:
    #- .cache/pip
    #- venv/

# Provision the selected stable interpreter independently of the runner's PATH.
.python_setup:
  before_script: &python_setup
    - virtualenv --python=python3.12 .ci-bootstrap
    - .ci-bootstrap/bin/python -m pip install uv==0.12.13
    - .ci-bootstrap/bin/uv venv --managed-python --python "$PYTHON_VERSION" --seed venv
    - source venv/bin/activate
    - python --version

before_script:
  - *python_setup
  - python -m pip install . --quiet

.python_versions:
  parallel: &python_versions
    matrix:
      - PYTHON_VERSION: ["3.12", "3.14"]

stages:
  - Build
  - Static Code Analysis
  - Unit Tests
  - Integration Tests

.crack_detection_model_cache:
  cache:
    key:
      files:
        - crackpy/tests/test_crack_detection/_model_download.py
      prefix: "crack-detection-models"
    paths:
      - crackpy/crack_detection/models/
    policy: pull-push

building:
  parallel: *python_versions
  stage: Build
  script:
    # Check Python version and installed packages
    - python --version
    - which python
    - which pip
    - pip list

installed_wheel:
  parallel: *python_versions
  stage: Build
  variables:
    MPLBACKEND: "Agg"
  before_script: *python_setup
  script:
    - python -m pip wheel --no-deps --wheel-dir dist .
    - WHEEL_ENV=$(mktemp -d /tmp/crackpy-wheel-venv.XXXXXX)
    - trap 'rm -rf "$WHEEL_ENV"' EXIT
    - python -m venv "$WHEEL_ENV"
    - '"$WHEEL_ENV/bin/python" -m pip install dist/*.whl'
    - '"$WHEEL_ENV/bin/python" -m pip check'
    - '"$WHEEL_ENV/bin/python" -m pip freeze > dist/installed-requirements.txt'
    - sha256sum dist/*.whl > dist/SHA256SUMS
    - cd /tmp
    - '"$WHEEL_ENV/bin/python" -I "$CI_PROJECT_DIR/scripts/check_installed_wheel.py"'
  artifacts:
    when: always
    paths:
      - dist/

# Check PEP-8-Guidelines with Pylint
lint_analysis:
  parallel: *python_versions
  stage: Static Code Analysis
  allow_failure: true
  script:
    - pip install pylint --quiet
    - pylint crackpy/fracture_analysis --rcfile='.pylintrc'
#    - pylint crackpy/tests/test_fracture_analysis --rcfile='.pylintrc'

lint_crack_detection:
  parallel: *python_versions
  stage: Static Code Analysis
  allow_failure: true
  script:
    - pip install pylint --quiet
    - pylint crackpy/crack_detection --rcfile='.pylintrc'
    - pylint crackpy/tests/test_crack_detection --rcfile='.pylintrc'


# Run Unit Tests
crack_detection:
  parallel: *python_versions
  extends: .crack_detection_model_cache
  stage: Unit Tests
  script:
    - python -m crackpy.tests.test_crack_detection._model_download
    - pip install pytest --quiet
    - pytest crackpy/tests/test_crack_detection --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

fracture_analysis:
  parallel: *python_versions
  stage: Unit Tests
  script:
    - pip install pytest --quiet
    - pytest crackpy/tests/test_fracture_analysis --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

test_utils:
  parallel: *python_versions
  stage: Unit Tests
  script:
    - pip install pytest --quiet
    - pytest crackpy/tests/test_utils crackpy/tests/test_structure_elements --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

# Run test scripts
test_crack_detection:
  parallel: *python_versions
  extends: .crack_detection_model_cache
  stage: Integration Tests
  script:
    - python -m crackpy.tests.test_crack_detection._model_download
    - pip install pytest --quiet
    - pytest test_scripts/test_crack_detection.py --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

test_fracture_analysis:
  parallel: *python_versions
  stage: Integration Tests
  script:
    - pip install pytest --quiet
    - pytest test_scripts/test_fracture_analysis.py --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
